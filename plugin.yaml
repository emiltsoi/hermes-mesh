name: hermes-mesh
version: 0.1.11
description: |
  Session-aware mesh relay for Hermes fleet agents.
  Registers mesh_list, mesh_register, mesh_send and a receive-side mesh platform adapter.
author: Emil Tsoi
kind: standalone
requires_env: []
provides_tools:
  - mesh_list
  - mesh_register
  - mesh_send
provides_platforms:
  - mesh
