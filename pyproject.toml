[project]
name = "hermes-mesh"
version = "0.1.24"
description = "Session-aware mesh relay for Hermes fleet agents — agent-to-agent communication, fleet identity, gateway hook float"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "aiohttp>=3.9",
    "cryptography>=41.0",
    "mesh-peer-registry>=0.1.6",
]

[project.urls]
Homepage = "https://github.com/emiltsoi/hermes-mesh"
Repository = "https://github.com/emiltsoi/hermes-mesh.git"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hermes_mesh"]

[project.entry-points."hermes_agent.plugins"]
hermes-mesh = "hermes_mesh"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["F401", "E501"]
exclude = ["tests/stubs"]
