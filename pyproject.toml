[project]
name = "hermes-mesh"
version = "0.1.26"
description = "Session-aware mesh relay for Hermes fleet agents — agent-to-agent communication, fleet identity, gateway hook float"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "aiohttp>=3.9",
    "cryptography>=41.0",
    "mesh-peer-registry>=0.1.8",
]

[project.urls]
Homepage = "https://github.com/emiltsoi/hermes-mesh"
Repository = "https://github.com/emiltsoi/hermes-mesh.git"

# No [build-system] on purpose. Hermes PM treats a plugin as a "virtual" workspace
# member when no build backend is declared, and renames it to a unique key
# (hermes-plugin-hermes-mesh-<hash>). A buildable member instead keeps its declared
# name, so the same plugin enabled in two profiles declares one name twice and hard-
# fails `uv lock` -- which is exactly what blocked mesh on the second of thirteen
# wives (2026-09-26). The fleet runs one shared PM environment across 13 profiles, so
# mesh MUST be virtual to be installable by more than one of them.
# Dependencies below are still read and installed by PM. Packaging is unaffected:
# PEP 517 falls back to the default setuptools backend when this table is absent.

[tool.setuptools]
packages = ["hermes_mesh"]

[project.entry-points."hermes_agent.plugins"]
hermes-mesh = "hermes_mesh"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["F401", "E501"]
exclude = ["tests/stubs"]
